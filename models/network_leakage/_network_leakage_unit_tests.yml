version: 2

unit_tests:
  - name: test_claim_line_network_status_and_cohort
    model: network_leakage__claim_line
    given:
      - input: ref('core__medical_claim')
        rows:
          - {data_source: s, claim_id: c1, claim_line_number: 1, person_id: p1, payer: medicare, claim_start_date: "2018-04-02", in_network_flag: 1, paid_amount: 100, allowed_amount: 120}
          - {data_source: s, claim_id: c2, claim_line_number: 1, person_id: p1, payer: medicare, claim_start_date: null, claim_line_start_date: "2018-06-01", in_network_flag: 0, paid_amount: null, allowed_amount: 50}
          - {data_source: s, claim_id: c3, claim_line_number: 1, person_id: p2, payer: medicare, claim_start_date: "2017-12-31", in_network_flag: null, paid_amount: 10, allowed_amount: 10}
          - {data_source: s, claim_id: c4, claim_line_number: 1, person_id: p3, payer: medicare, claim_start_date: "2018-01-01", in_network_flag: 1, paid_amount: 5, allowed_amount: 5}
      - input: ref('core__patient')
        rows:
          - {person_id: p1, sex: female, birth_date: "1950-03-14"}
          - {person_id: p2, sex: male, birth_date: "1935-01-01"}
    expect:
      rows:
        - {claim_id: c1, service_date: "2018-04-02", service_year: 2018, sex: female, age_at_service: 68, age_band: 65-74, network_status: in_network, paid_amount: 100, allowed_amount: 120}
        - {claim_id: c2, service_date: "2018-06-01", service_year: 2018, sex: female, age_at_service: 68, age_band: 65-74, network_status: out_of_network, paid_amount: 0, allowed_amount: 50}
        - {claim_id: c3, service_date: "2017-12-31", service_year: 2017, sex: male, age_at_service: 82, age_band: 75-84, network_status: unknown, paid_amount: 10, allowed_amount: 10}
        - {claim_id: c4, service_date: "2018-01-01", service_year: 2018, sex: unknown, age_at_service: null, age_band: unknown, network_status: in_network, paid_amount: 5, allowed_amount: 5}

  - name: test_member_cohort_summary_leakage_rates
    model: network_leakage__member_cohort_summary
    given:
      - input: ref('network_leakage__claim_line')
        rows:
          - {service_year: 2018, payer: medicare, plan_name: a, age_band: 65-74, sex: female, person_id: p1, network_status: in_network, paid_amount: 60, allowed_amount: 80}
          - {service_year: 2018, payer: medicare, plan_name: a, age_band: 65-74, sex: female, person_id: p1, network_status: out_of_network, paid_amount: 20, allowed_amount: 20}
          - {service_year: 2018, payer: medicare, plan_name: a, age_band: 65-74, sex: female, person_id: p2, network_status: out_of_network, paid_amount: 20, allowed_amount: 20}
          - {service_year: 2018, payer: medicare, plan_name: a, age_band: 65-74, sex: female, person_id: p3, network_status: unknown, paid_amount: 25, allowed_amount: 25}
          - {service_year: 2018, payer: medicare, plan_name: a, age_band: 75-84, sex: male, person_id: p4, network_status: unknown, paid_amount: 10, allowed_amount: 10}
    expect:
      rows:
        - {age_band: 65-74, sex: female, member_count: 3, out_of_network_member_count: 2, claim_line_count: 4, out_of_network_claim_line_count: 2, in_network_paid_amount: 60, out_of_network_paid_amount: 40, unknown_network_paid_amount: 25, total_paid_amount: 125, leakage_rate_paid: 0.4, leakage_rate_allowed: 0.33333333333333333, unknown_network_paid_share: 0.2}
        - {age_band: 75-84, sex: male, member_count: 1, out_of_network_member_count: 0, claim_line_count: 1, out_of_network_claim_line_count: 0, in_network_paid_amount: 0, out_of_network_paid_amount: 0, unknown_network_paid_amount: 10, total_paid_amount: 10, leakage_rate_paid: null, leakage_rate_allowed: null, unknown_network_paid_share: 1.0}
