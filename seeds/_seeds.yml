        deductible_amount: float
        in_network_flag: integer
        data_source: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(255) {%- endif -%}
        file_name: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(255) {%- endif -%}
        file_date: date
        ingest_datetime: |
          {%- if target.type in ("postgres", "databricks") -%} timestamp 
          {%- elif target.type == "fabric" -%} datetime2(6)
          {%- else -%} datetime {%- endif -%}
    description: '{{ doc("claim_amount_checks") }}'
    data_tests:
      - dbt_expectations.expect_column_median_to_be_between:
          name: pharmacy_claim__paid_amount__median_in_band
          description: 'Median paid_amount stays within 0.5x-2x of the demo baseline.'
          arguments:
            column_name: paid_amount
            min_value: 17
            max_value: 69
          config:
            severity: '{{ var(''claim_amount_distribution_severity'', ''error'') }}'
            enabled: '{{ (target.type != ''fabric'') | as_bool }}'
            tags: [claim_amount_checks, claim_amount_distribution]
      - dbt_expectations.expect_column_mean_to_be_between:
          name: pharmacy_claim__paid_amount__mean_in_band
          description: 'Mean paid_amount stays within 0.5x-2x of the demo baseline; the mean is outlier-sensitive, so extreme lines move it.'
          arguments:
            column_name: paid_amount
            min_value: 83
            max_value: 340
          config:
            severity: '{{ var(''claim_amount_distribution_severity'', ''error'') }}'
            enabled: '{{ (target.type != ''fabric'') | as_bool }}'
            tags: [claim_amount_checks, claim_amount_distribution]
      - dbt_expectations.expect_column_quantile_values_to_be_between:
          name: pharmacy_claim__paid_amount__p99_in_band
          description: '99th percentile paid_amount stays within 1/3x-3x of the demo baseline.'
          arguments:
            column_name: paid_amount
            quantile: 0.99
            min_value: 590
            max_value: 5400
          config:
            severity: '{{ var(''claim_amount_distribution_severity'', ''error'') }}'
            enabled: '{{ (target.type != ''fabric'') | as_bool }}'
            tags: [claim_amount_checks, claim_amount_distribution]
      - dbt_expectations.expect_column_median_to_be_between:
          name: pharmacy_claim__allowed_amount__median_in_band
          description: 'Median allowed_amount stays within 0.5x-2x of the demo baseline.'
          arguments:
            column_name: allowed_amount
            min_value: 26
            max_value: 110
          config:
            severity: '{{ var(''claim_amount_distribution_severity'', ''error'') }}'
            enabled: '{{ (target.type != ''fabric'') | as_bool }}'
            tags: [claim_amount_checks, claim_amount_distribution]
      - dbt_expectations.expect_column_mean_to_be_between:
          name: pharmacy_claim__allowed_amount__mean_in_band
          description: 'Mean allowed_amount stays within 0.5x-2x of the demo baseline; the mean is outlier-sensitive, so extreme lines move it.'
          arguments:
            column_name: allowed_amount
            min_value: 350
            max_value: 1500
          config:
            severity: '{{ var(''claim_amount_distribution_severity'', ''error'') }}'
            enabled: '{{ (target.type != ''fabric'') | as_bool }}'
            tags: [claim_amount_checks, claim_amount_distribution]
      - dbt_expectations.expect_column_quantile_values_to_be_between:
          name: pharmacy_claim__allowed_amount__p99_in_band
          description: '99th percentile allowed_amount stays within 1/3x-3x of the demo baseline.'
          arguments:
            column_name: allowed_amount
            quantile: 0.99
            min_value: 2600
            max_value: 24000
          config:
            severity: '{{ var(''claim_amount_distribution_severity'', ''error'') }}'
            enabled: '{{ (target.type != ''fabric'') | as_bool }}'
            tags: [claim_amount_checks, claim_amount_distribution]
      - dbt_expectations.expression_between:
          name: pharmacy_claim__paid_amount__negative_share_within_tolerance
          description: 'Share of non-null paid_amount values that are negative stays at or below claim_amount_negative_share_max.'
          arguments:
            expression: 'sum(case when paid_amount < 0 then 1 else 0 end) * 1.0 / nullif(count(paid_amount), 0)'
            max_value: '{{ var(''claim_amount_negative_share_max'') }}'
          config:
            severity: error
            enabled: '{{ (target.type != ''fabric'') | as_bool }}'
            tags: [claim_amount_checks, claim_amount_range]
      - dbt_expectations.expression_between:
          name: pharmacy_claim__allowed_amount__negative_share_within_tolerance
          description: 'Share of non-null allowed_amount values that are negative stays at or below claim_amount_negative_share_max.'
          arguments:
            expression: 'sum(case when allowed_amount < 0 then 1 else 0 end) * 1.0 / nullif(count(allowed_amount), 0)'
            max_value: '{{ var(''claim_amount_negative_share_max'') }}'
          config:
            severity: error
            enabled: '{{ (target.type != ''fabric'') | as_bool }}'
            tags: [claim_amount_checks, claim_amount_range]
    columns:
      - name: paid_amount
        description: 'Amount paid by the payer for the fill. Negative values usually mean adjustment/denial/reversal (ADR) logic was not applied upstream.'
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              name: pharmacy_claim__paid_amount__not_negative
              description: 'Every non-null paid_amount is >= 0. Warns and lists each offending line; the share-based test on the seed escalates to an error.'
              arguments:
                min_value: 0
              config:
                severity: warn
                enabled: '{{ (target.type != ''fabric'') | as_bool }}'
                tags: [claim_amount_checks, claim_amount_range]
          - dbt_expectations.expect_column_values_to_be_between:
              name: pharmacy_claim__paid_amount__below_fill_ceiling
              description: 'No single pharmacy fill is paid above claim_amount_pharmacy_fill_max.'
