    description: '{{ doc("claim_amount_checks") }}'
    data_tests:
      - dbt_expectations.expect_column_median_to_be_between:
          name: medical_claim__paid_amount__professional__median_in_band
          description: 'Median paid_amount (professional) stays within 0.5x-2x of the demo baseline.'
          arguments:
            column_name: paid_amount
            min_value: 7.5
            max_value: 31
            row_condition: 'claim_type = ''professional'''
          config:
            severity: '{{ var(''claim_amount_distribution_severity'', ''error'') }}'
            enabled: '{{ (target.type != ''fabric'') | as_bool }}'
            tags: [claim_amount_checks, claim_amount_distribution]
      - dbt_expectations.expect_column_mean_to_be_between:
          name: medical_claim__paid_amount__professional__mean_in_band
          description: 'Mean paid_amount (professional) stays within 0.5x-2x of the demo baseline; the mean is outlier-sensitive, so extreme lines move it.'
          arguments:
            column_name: paid_amount
            min_value: 22
            max_value: 92
            row_condition: 'claim_type = ''professional'''
          config:
            severity: '{{ var(''claim_amount_distribution_severity'', ''error'') }}'
