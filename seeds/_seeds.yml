    columns:
      - name: paid_amount
        description: 'Amount paid by the payer for the claim line. Negative values usually mean adjustment/denial/reversal (ADR) logic was not applied upstream.'
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              name: medical_claim__paid_amount__not_negative
              description: 'Every non-null paid_amount is >= 0. Warns and lists each offending line; the share-based test on the seed escalates to an error.'
              arguments:
                min_value: 0
              config:
                severity: warn
                enabled: '{{ (target.type != ''fabric'') | as_bool }}'
                tags: [claim_amount_checks, claim_amount_range]
          - dbt_expectations.expect_column_values_to_be_between:
              name: medical_claim__paid_amount__below_line_ceiling
              description: 'No single medical claim line is paid above claim_amount_medical_line_paid_max.'
              arguments:
                max_value: '{{ var(''claim_amount_medical_line_paid_max'') }}'
              config:
                severity: error
                enabled: '{{ (target.type != ''fabric'') | as_bool }}'
                tags: [claim_amount_checks, claim_amount_range]
