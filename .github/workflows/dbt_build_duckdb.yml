name: dbt build (DuckDB)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-build-duckdb-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dbt_build:
    name: dbt build / DuckDB (local)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHON_VERSION: "3.10"
      DBT_CORE_VERSION: "1.10.15"
      DBT_DUCKDB_VERSION: "1.11.0"
      DBT_PROFILES_DIR: ./integration_tests/profiles/duckdb
      # The shared DuckDB profile reads its path from this variable; point it at a
      # throwaway local file so the job needs no MotherDuck credentials.
      DBT_MOTHERDUCK_CI_PATH: ${{ github.workspace }}/target/ci.duckdb
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core==${DBT_CORE_VERSION}" "dbt-duckdb==${DBT_DUCKDB_VERSION}"

      - name: Install dbt packages
        # --no-version-check: the hub metadata for the_tuva_project 1.0.0 has an
        # unparseable require_dbt_version that otherwise crashes dependency resolution.
        run: dbt deps --no-version-check

      - name: Test connection
        run: |
          mkdir -p target
          dbt debug

      - name: dbt build (seeds, models, tests)
        run: dbt build --full-refresh

      - name: Upload dbt artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dbt-duckdb-artifacts
          path: |
            target/run_results.json
            target/manifest.json
            logs/dbt.log
          if-no-files-found: ignore
